[package]
name = "stela-boot"
version = "0.4.1"
edition = "2024"
license = "GPL-2.0-or-later AND GPL-2.0-only AND BSD-2-Clause"
description = "stela.efi: the UEFI application that boots macOS on a PC through Stela"
repository = "https://github.com/tylertms/Stela"
rust-version = "1.99"
publish = false

[[bin]]
name = "stela"
path = "src/main.rs"
# Its host-testable logic lives in `stela-boot-core`; this freestanding entry
# supplies its own allocator and panic handler, not a libtest executable.
test = false

# A workspace of its own: the binary builds only for x86_64-unknown-uefi
# (no_std, no_main, its own allocator and panic handler), which a root
# member would be built and linked for the host by `cargo build/test
# --workspace`, and it aborts on panic in every profile, which a root
# profile would impose on every host crate. Cargo's per-package
# `forced-target` would allow membership once stable. Until then the
# edition, lints and release profile below repeat the root's
# `[workspace.package]`, `[workspace.lints]` and `[profile.release]`;
# change both together. Its firmware-independent logic lives in the root
# member `stela-boot-core`, tested there.
[workspace]

[features]
default = []
diagnostics = ["stela-drivers/irq-diagnostics"]
native-profile = ["stela-soc/native-profile", "stela-engine/native-profile"]
# NVK, NIR and NAK in the image, from `cargo xtask gpu nvk`.
nvk = ["dep:stela-mesa", "stela-drivers/metal-linked"]

[dependencies]
stela-linux = { path = "../stela-linux", features = ["kernel"] }
stela-soc-data = { path = "../stela-soc-data", default-features = false }
stela-engine = { path = "../stela-engine", default-features = false }
stela-contracts = { path = "../stela-contracts", default-features = false }
stela-crypto = { path = "../stela-crypto" }
stela-tls = { path = "../stela-tls" }
stela-formats = { path = "../stela-formats", default-features = false }
uefi = { version = "0.41", default-features = false, features = ["alloc"] }
stela-boot-core = { path = "../stela-boot-core", features = ["native-acpi"] }
stela-drivers = { path = "../stela-drivers", features = ["native-acpi", "nouveau-port"] }
stela-soc = { path = "../stela-soc", default-features = false }
stela-mesa = { path = "../stela-mesa", optional = true }
stela-runtime = { path = "../stela-runtime", default-features = false }
stela-loader = { path = "../stela-loader", default-features = false }
stela-compiler = { path = "../stela-compiler", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
# Line tables go to the separate PDB, so profiles of a boot can name the
# engine's functions; the image itself is unchanged.
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[patch.crates-io]
# Same dependency source as the root workspace; no second network stack.
smoltcp = { path = "../../third_party/smoltcp" }
